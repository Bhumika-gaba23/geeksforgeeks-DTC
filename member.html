<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <script src="theme-init.js"></script>
  <title>Core Team Member — GeeksforGeeks DTC</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--green:#2f8d46;--dark:#07110a;--muted:#9aaba0;--line:#26352b}*{box-sizing:border-box}body{margin:0;background:var(--dark);color:#fff;font-family:Manrope,sans-serif}a{color:inherit;text-decoration:none}.wrap{width:min(1160px,calc(100% - 40px));margin:auto}.nav{border-bottom:1px solid var(--line);background:#07110aeb;backdrop-filter:blur(14px);position:sticky;top:0;z-index:10}.nav-inner{height:76px;display:flex;align-items:center;justify-content:space-between}.logo{height:54px;width:260px;object-fit:cover;filter:brightness(0) saturate(100%) invert(50%) sepia(18%) saturate(1591%) hue-rotate(83deg)}.back{font:500 .72rem 'DM Mono',monospace;letter-spacing:.06em;text-transform:uppercase;color:#9ad6a6}.profile{min-height:calc(100vh - 76px);display:grid;grid-template-columns:minmax(330px,.82fr) 1fr;gap:72px;align-items:center;padding:68px 0}.portrait{position:relative;aspect-ratio:3/4;border:1px solid #2f8d4666;border-radius:22px;overflow:hidden;background:linear-gradient(145deg,#173b22,#09140c);box-shadow:25px 25px 0 #0d2113}.portrait img{width:100%;height:100%;object-fit:cover;object-position:center;transition:transform .65s cubic-bezier(.2,.8,.2,1)}.portrait:hover img{transform:scale(1.045)}.initials{height:100%;display:grid;place-items:center;font:700 clamp(5rem,12vw,10rem) Sora;color:#70c982}.eyebrow{font:500 .72rem 'DM Mono';letter-spacing:.12em;text-transform:uppercase;color:#75ce86}.role{display:inline-flex;margin-top:22px;padding:8px 11px;border-radius:6px;background:#122219;color:#6bd17f;font:500 .68rem 'DM Mono';letter-spacing:.08em;text-transform:uppercase}.name{margin:18px 0 20px;font:700 clamp(3rem,7vw,6.8rem)/.92 Sora,sans-serif;letter-spacing:-.075em}.bio{max-width:620px;color:var(--muted);font-size:1.08rem;line-height:1.8}.quote{margin:34px 0 38px;padding-left:20px;border-left:3px solid var(--green);font:500 1rem/1.7 'DM Mono';color:#e5eee7}.links{display:flex;gap:12px;flex-wrap:wrap}.action{display:flex;align-items:center;justify-content:space-between;gap:28px;min-width:168px;padding:15px 17px;border:1px solid var(--line);border-radius:10px;color:#b8c6bb;font-weight:800;transition:.25s}.action.available:hover{background:var(--green);border-color:var(--green);color:#fff;transform:translateY(-3px)}.action.unavailable{opacity:.38;cursor:not-allowed}.not-found{padding:100px 0}.not-found a{color:#72ce84}@media(max-width:800px){.profile{grid-template-columns:1fr;gap:45px;padding:40px 0 70px}.portrait{max-height:620px}.logo{width:210px}.name{font-size:3.3rem}.links{display:grid;grid-template-columns:1fr}.action{width:100%}}
    .theme-button{display:grid;place-items:center;width:40px;height:40px;border:1px solid var(--line);border-radius:50%;background:#0b160e;color:#64c778;font-size:1rem;cursor:pointer;transition:transform .25s,background .25s}.theme-button:hover{transform:rotate(16deg)}
    html:not(.dark) body{background:#f6f8f6;color:#17251d}html:not(.dark) .nav{background:#fffffff0;border-color:#d8e4db}html:not(.dark) .theme-button{background:#fff;border-color:#d8e4db;color:#2f8d46}html:not(.dark) .bio{color:#637168}html:not(.dark) .quote{color:#26382b}html:not(.dark) .action{color:#47604e;border-color:#d8e4db}html:not(.dark) .portrait{box-shadow:25px 25px 0 #dcecdf}
  </style>
</head>
<body>
  <header class="nav"><div class="wrap nav-inner"><a href="index.html"><img class="logo" src="dtc-campus-body-logo.png" alt="DTC Campus Body"></a><a class="back" href="team.html">← Back to core team</a><button id="theme-button" class="theme-button" type="button" aria-label="Switch color theme">☾</button></div></header>
  <main id="profile-root" class="wrap"></main>
  <script src="member-profile.js"></script>
</body>
</html>
